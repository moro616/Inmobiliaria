<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1428">
<meta name="description" content="Rosario, oraciones, novenas, calendario litúrgico y noticias católicas desde la Argentina.">
<title>Mi Fe Católica</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <header class="top">
    <button class="btn-atras oculto" id="btnAtras" data-a="atras" aria-label="Volver"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="marca"><span class="cruz logo" aria-hidden="true"><img src="icon.svg" alt=""></span><div><strong>Mi Fe Católica</strong><small>Un momento para Dios, cada día</small></div></div>
  </header>
  <main id="main" tabindex="-1"></main>
  <div id="mini" class="mini oculto" role="region" aria-label="Música sonando">
    <div class="mini-barra"><i id="miniBarra"></i></div>
    <button class="mini-abrir" data-a="ir:musica" aria-label="Abrir música"><span id="miniTapa" class="mini-tapa"></span><span class="mini-txt"><strong id="miniTit"></strong><small id="miniSub"></small></span></button>
    <button class="mini-btn" id="miniPlay" data-a="mini:play" aria-label="Pausar"></button>
    <button class="mini-btn" data-a="mini:sig" aria-label="Siguiente"><svg viewBox="0 0 24 24"><path d="M6 6l8 6-8 6zM17 6v12"/></svg></button>
    <button class="mini-btn chico" data-a="mini:cerrar" aria-label="Cerrar"><svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg></button>
  </div>
  <nav class="bottom" aria-label="Navegación principal">
    <button data-a="ir:inicio"><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 11.5L12 4l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/><path d="M10 20v-5h4v5"/></svg></span>Inicio</button>
    <button data-a="ir:rosario"><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="14.6" cy="3.5" r="1.15" fill="currentColor" stroke="none"/><circle cx="16.5" cy="5.4" r="1.15" fill="currentColor" stroke="none"/><circle cx="17.2" cy="8.0" r="1.15" fill="currentColor" stroke="none"/><circle cx="16.5" cy="10.6" r="1.15" fill="currentColor" stroke="none"/><circle cx="14.6" cy="12.5" r="1.15" fill="currentColor" stroke="none"/><circle cx="9.4" cy="12.5" r="1.15" fill="currentColor" stroke="none"/><circle cx="7.5" cy="10.6" r="1.15" fill="currentColor" stroke="none"/><circle cx="6.8" cy="8.0" r="1.15" fill="currentColor" stroke="none"/><circle cx="7.5" cy="5.4" r="1.15" fill="currentColor" stroke="none"/><circle cx="9.4" cy="3.5" r="1.15" fill="currentColor" stroke="none"/><path d="M12 13.2v2.3M12 17v5M9.6 19h4.8"/><circle cx="12" cy="13.2" r=".1"/></svg></span>Rosario</button>
    <button data-a="ir:oraciones"><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3c1.6 2 2.5 3.6 2.5 5a2.5 2.5 0 01-5 0c0-1.4.9-3 2.5-5z"/><path d="M8.5 13h7v8h-7z"/><path d="M6 21h12"/></svg></span>Oraciones</button>
    <button data-a="ir:explorar"><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.8"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.8"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.8"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.8"/></svg></span>Explorar</button>
    <button data-a="ir:ajustes"><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg></span>Ajustes</button>
  </nav>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="config.js"></script>
<script src="js/datos/oraciones-tradicionales.js"></script>
<script src="js/datos/devociones.js"></script>
<script src="js/datos/oraciones-originales.js"></script>
<script src="js/datos/oraciones-extra.js"></script>
<script src="js/datos/contenido-libre.js"></script>
<script src="js/datos/rosario.js"></script>
<script src="js/datos/novenas.js"></script>
<script src="js/datos/formacion.js"></script>
<script src="js/datos/fuentes.js"></script>
<script src="js/datos/frases.js"></script>
<script src="js/datos/biblia-indice.js"></script>
<script src="js/datos/voz.js"></script>
<script src="js/liturgia.js"></script>
<script src="js/nativo.js"></script>
<script src="js/app.js"></script>
</body>
</html>
